<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Moldura de perfil">
  <title>Moldura de perfil — arte provisória da campanha</title>

  <!--
    PROVISÓRIA — mesma observação da moldura de story: nada aqui
    avisa que é provisória, porque isso apareceria na foto de perfil
    de quem usar. O aviso para a campanha vive no painel.

    O desenho é um ANEL, e não uma faixa no rodapé, porque o destino
    principal deste formato é foto de perfil do WhatsApp, que corta em
    círculo. Faixa no rodapé perde as pontas no corte — e junto com
    elas o CNPJ, que é exigência legal. Tudo o que precisa sobreviver
    está dentro do círculo inscrito.
  -->

  <circle cx="540" cy="540" r="512" fill="none" stroke="#fbd83f" stroke-width="28"/>
  <circle cx="540" cy="540" r="490" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.5"/>

  <!-- A pílula cabe inteira dentro do círculo: o canto mais distante
       do centro fica a 491px, e o raio é 512. -->
  <rect x="270" y="780" width="540" height="170" rx="62" fill="#01518f"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="540" y="824" font-size="26" font-weight="700" letter-spacing="6" fill="#fbd83f">EU APOIO</text>
    <text x="540" y="880" font-size="42" font-weight="700" letter-spacing="-1" fill="#ffffff">Sofia Andrade <tspan fill="#fbd83f">2233</tspan></text>
    <text x="540" y="924" font-size="19" fill="#ffffff" fill-opacity="0.62">CNPJ 68.379.640/0001-98</text>
  </g>
</svg>
