<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Moldura de story">
  <title>Moldura de story — arte provisória da campanha</title>

  <!--
    PROVISÓRIA. A arte final entra pelo painel, em Imagens ▸ Moldura de
    story, e passa a valer sem deploy. Esta fica como rede de segurança.

    Nada aqui avisa que é provisória, e é de propósito: a versão
    anterior carimbava "moldura placeholder — trocar pela arte final"
    dentro da imagem EXPORTADA. Quem gerasse uma foto hoje postaria isso
    no story. Aviso para a campanha é no painel; na arte que circula,
    não.

    ⚠️ EXIGÊNCIA LEGAL: o CNPJ precisa continuar legível em qualquer
       arte que substitua esta — a imagem gerada é propaganda eleitoral.

    ⚠️ "EU APOIO" não é enfeite: faz a peça ler como apoiador, não como
       post oficial. É a única mitigação real contra alguém colar a
       marca numa foto ofensiva.
  -->

  <defs>
    <linearGradient id="veu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#013a67" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#013a67" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#013a67" stop-opacity="0.97"/>
    </linearGradient>
  </defs>

  <!-- O véu sobe em degradê em vez de cortar reto: borda dura no meio
       de uma foto lê como tarja, e a pessoa não posta uma tarja. -->
  <rect x="0" y="1120" width="1080" height="800" fill="url(#veu)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="88" y="1586" font-size="38" font-weight="700" letter-spacing="9" fill="#fbd83f">EU APOIO</text>
    <text x="88" y="1684" font-size="84" font-weight="700" letter-spacing="-2" fill="#ffffff">Sofia Andrade</text>
    <text x="88" y="1738" font-size="27" fill="#ffffff" fill-opacity="0.72">Deputada Federal · Rondônia</text>
    <text x="88" y="1782" font-size="22" fill="#ffffff" fill-opacity="0.55">CNPJ 68.379.640/0001-98</text>

    <rect x="742" y="1596" width="250" height="120" rx="34" fill="#fbd83f"/>
    <text x="867" y="1682" font-size="74" font-weight="700" letter-spacing="-3" fill="#01518f" text-anchor="middle">2233</text>
  </g>

  <rect x="0" y="1896" width="1080" height="24" fill="#fbd83f"/>
</svg>
